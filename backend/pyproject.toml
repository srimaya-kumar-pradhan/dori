[project]
name = "dori-backend"
version = "0.1.0"
description = "DORI - Predictive Continuity of Care Infrastructure for Rural India"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "qrcode[pil]>=7.4.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.4.6",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "matplotlib>=3.11.2",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "ICN"]
ignore = ["S101", "COM812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
